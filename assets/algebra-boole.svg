<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">

  <rect width="1200" height="650" rx="28" fill="#f8faf9"/>

  <text x="60" y="70" font-family="Arial" font-size="38" font-weight="800" fill="#123c33">
    Circuito lógico ↔ Expresión booleana
  </text>

  <text x="60" y="108" font-family="Arial" font-size="18" fill="#64748b">
    Dos formas diferentes de representar exactamente el mismo comportamiento.
  </text>

  <g font-family="Arial">

    <!-- Inputs -->
    <text x="80" y="220" font-size="26" font-weight="700" fill="#123c33">A</text>
    <text x="80" y="290" font-size="26" font-weight="700" fill="#123c33">B</text>
    <text x="80" y="420" font-size="26" font-weight="700" fill="#123c33">C</text>

    <!-- AND wires -->
    <line x1="115" y1="210" x2="255" y2="210" stroke="#173b35" stroke-width="4"/>
    <line x1="115" y1="280" x2="255" y2="280" stroke="#173b35" stroke-width="4"/>

    <!-- AND -->
    <rect x="255" y="170" width="170" height="150" rx="22" fill="#123c33"/>
    <text x="340" y="235" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">
      AND
    </text>
    <text x="340" y="275" text-anchor="middle" font-size="20" fill="#f5c542">
      A · B
    </text>

    <!-- NOT -->
    <line x1="115" y1="410" x2="255" y2="410" stroke="#173b35" stroke-width="4"/>

    <rect x="255" y="365" width="170" height="100" rx="20" fill="#0f766e"/>
    <text x="340" y="410" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">
      NOT
    </text>
    <text x="340" y="442" text-anchor="middle" font-size="20" fill="#d6fff2">
      C'
    </text>

    <!-- OR -->
    <line x1="425" y1="245" x2="540" y2="245" stroke="#173b35" stroke-width="4"/>
    <path d="M425 415 H500 V300 H540" fill="none" stroke="#173b35" stroke-width="4"/>

    <rect x="540" y="210" width="170" height="160" rx="22" fill="#e6a51c"/>
    <text x="625" y="275" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">
      OR
    </text>
    <text x="625" y="318" text-anchor="middle" font-size="19" fill="#fff7dc">
      +
    </text>

    <!-- Output -->
    <line x1="710" y1="290" x2="790" y2="290" stroke="#173b35" stroke-width="4"/>
    <circle cx="800" cy="290" r="8" fill="#16a36d"/>

    <text x="830" y="300" font-size="30" font-weight="700" fill="#123c33">
      Y
    </text>

    <!-- Expression box -->
    <rect x="790" y="170" width="340" height="220" rx="24" fill="#ffffff" stroke="#d7e2df" stroke-width="2"/>

    <text x="830" y="220" font-size="21" font-weight="700" fill="#123c33">
      Expresión equivalente
    </text>

    <text x="830" y="285" font-size="38" font-weight="800" fill="#0f766e">
      Y = A·B + C'
    </text>

    <line x1="830" y1="320" x2="1085" y2="320" stroke="#d7e2df"/>

    <text x="830" y="355" font-size="17" fill="#64748b">
      Prioridad:
    </text>

    <text x="920" y="355" font-size="18" font-weight="700" fill="#d97706">
      NOT → AND → OR
    </text>

    <!-- Bottom -->
    <rect x="70" y="515" width="1060" height="80" rx="18" fill="#123c33"/>

    <text x="600" y="565" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">
      Circuito físico y expresión matemática representan la misma función lógica
    </text>

  </g>
</svg>
