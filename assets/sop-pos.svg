<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">

  <rect width="1200" height="680" rx="28" fill="#f8faf9"/>

  <text x="60" y="70" font-family="Arial" font-size="38" font-weight="800" fill="#123c33">
    Formas canónicas · SOP y POS
  </text>

  <text x="60" y="108" font-family="Arial" font-size="18" fill="#64748b">
    Dos formas sistemáticas de representar una función booleana.
  </text>

  <g font-family="Arial">

    <!-- SOP -->
    <rect x="70" y="155" width="480" height="395" rx="24" fill="#123c33"/>

    <text x="110" y="210" font-size="30" font-weight="800" fill="#ffffff">
      SOP
    </text>

    <text x="110" y="245" font-size="18" fill="#b9ded0">
      Sum of Products
    </text>

    <text x="110" y="290" font-size="21" fill="#ffffff">
      Se obtiene normalmente a partir de:
    </text>

    <text x="110" y="335" font-size="29" font-weight="700" fill="#f5c542">
      F = 1
    </text>

    <text x="110" y="385" font-size="18" fill="#d7eee6">
      Cada fila genera un minitérmino.
    </text>

    <rect x="110" y="420" width="365" height="75" rx="14" fill="#ffffff"/>

    <text x="292" y="467" text-anchor="middle" font-size="24" font-weight="700" fill="#123c33">
      F = A'BC + AB'C + ABC
    </text>

    <!-- POS -->
    <rect x="650" y="155" width="480" height="395" rx="24" fill="#0f766e"/>

    <text x="690" y="210" font-size="30" font-weight="800" fill="#ffffff">
      POS
    </text>

    <text x="690" y="245" font-size="18" fill="#d6fff2">
      Product of Sums
    </text>

    <text x="690" y="290" font-size="21" fill="#ffffff">
      Se obtiene normalmente a partir de:
    </text>

    <text x="690" y="335" font-size="29" font-weight="700" fill="#f5c542">
      F = 0
    </text>

    <text x="690" y="385" font-size="18" fill="#d6fff2">
      Cada fila genera un maxitérmino.
    </text>

    <rect x="690" y="420" width="365" height="75" rx="14" fill="#ffffff"/>

    <text x="872" y="467" text-anchor="middle" font-size="22" font-weight="700" fill="#123c33">
      F = (A+B)(A'+C)(B+C')
    </text>

    <!-- Footer -->
    <rect x="170" y="585" width="860" height="58" rx="18" fill="#e8f4ef"/>

    <text x="600" y="622" text-anchor="middle" font-size="20" font-weight="700" fill="#123c33">
      SOP → minitérminos · POS → maxitérminos
    </text>

  </g>
</svg>
